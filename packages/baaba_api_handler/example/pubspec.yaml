name: baaba_api_handler_example
description: "Runnable example for baaba_api_handler."
publish_to: none
version: 1.0.0

environment:
  sdk: ^3.8.0
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  baaba_api_handler:
    path: ../

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.0
  baaba_api_generator:
    path: ../../baaba_api_generator
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

# baaba_api_generator asks for baaba_api_handler from pub.dev; use this
# repository's copy everywhere instead.
dependency_overrides:
  baaba_api_handler:
    path: ../
