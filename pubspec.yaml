name: baaba_api_handler
description: "A typed, functional HTTP client for Flutter. Wraps Dio with Either-based error handling, token refresh, retries, response caching, and a built-in test double."
version: 2.0.0

topics:
  - http
  - networking
  - dio
  - rest
  - api

environment:
  sdk: ">=3.3.1 <4.0.0"
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.10.0
  pretty_dio_logger: ^1.4.0
  internet_connection_checker_plus: ^3.1.1
  fpdart: ^1.2.0
  api_cache_manager: ^1.0.2
  equatable: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^0.3.0
  sqflite_common_ffi: ^2.4.0+3
